<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Identite Arpent adoptee le 20/09 (le « A »-pignon aux pieds
         d'arpentage, encre + sommet orange) — remplace l'ancienne identite
         Ayad, retiree du depot. SVG d'abord, PNG 32 en repli. -->
    <link rel="icon" type="image/svg+xml" href="/brand/arpent-favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/arpent-mark-32.png" />
    <link rel="apple-touch-icon" href="/brand/arpent-app-tile-1024.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arpent — CRM immobilier</title>
    <script>
      // Applies the saved/system theme before first paint so there's no
      // flash of the wrong theme. Mirrors the fallback logic in src/lib/theme.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('arpent-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
