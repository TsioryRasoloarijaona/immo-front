<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Aucun favicon : le produit n'a pas de logo, et l'ancien portait
         l'identite Ayad. Les fichiers restent dans public/brand/, non
         supprimes, donc le recablage est une ligne. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arpent — CRM immobilier</title>
    <script>
      // Applies the saved/system theme before first paint so there's no
      // flash of the wrong theme. Mirrors the fallback logic in src/lib/theme.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('arpent-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
